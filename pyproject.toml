[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcss-morgue-report"
version = "1.0.0"
description = "Turn a DCSS player's morgue files into a stats-heavy HTML career report"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dcss", "dungeon-crawl-stone-soup", "morgue", "stats", "report"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]

[project.scripts]
dcssreport = "dcssreport.__main__:main"

[tool.setuptools]
packages = ["dcssreport"]
